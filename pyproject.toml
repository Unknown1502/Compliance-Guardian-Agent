[project]
name = "compliance-guardian"
version = "0.1.0"
description = "ComplianceGuardian — agentic compliance automation for SMBs (XPRIZE Build with Gemini)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "shared",
    "services/ingestion-agent",
    "services/compliance-agent",
    "services/escalation-service",
    "services/orchestrator",
    "services/reporting-agent",
    "services/remediation-agent",
    "apps/api-gateway",
    ".",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
