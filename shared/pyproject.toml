[project]
name = "cg-shared"
version = "0.1.0"
description = "ComplianceGuardian shared packages: auth middleware, audit logger, schema validators, GCP client factories"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "google-cloud-firestore>=2.16,<3",
    "google-cloud-bigquery>=3.25,<4",
    "google-cloud-storage>=2.16,<3",
    "google-genai>=1.20,<2",
    "firebase-admin>=6.5,<7",
    "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_middleware*", "audit_logger*", "schema_validators*", "gcp_clients*", "gemini_client*", "task_dispatch*"]
